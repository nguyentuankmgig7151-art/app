<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品详情 · 零食铺子</title>
  <meta name="description" content="零食铺子商品详情页，查看大图、价格、评分、库存与描述并加入购物车。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="product">

  <!-- 顶部导航 -->
  <header class="site-header">
    <div class="container nav">
      <a class="nav-logo" href="index.html" aria-label="零食铺子首页">
        <span class="emoji" aria-hidden="true">🍿</span>
        <span class="logo-text">零食铺子</span>
      </a>

      <form class="nav-search" id="nav-search-form" action="products.html" method="get" role="search">
        <label for="nav-search-input" hidden>搜索零食</label>
        <input type="search" id="nav-search-input" name="q"
               placeholder="搜索零食，如「薯片」「巧克力」" autocomplete="off">
        <button class="btn btn-primary" type="submit">搜索</button>
      </form>

      <nav class="nav-links" aria-label="主导航">
        <a class="nav-link" href="index.html">首页</a>
        <a class="nav-link" href="products.html">商品</a>
        <a class="nav-link cart-link" href="cart.html">
          <span aria-hidden="true">🛒</span>
          <span>购物车</span>
          <span class="cart-badge" id="cart-badge" hidden>0</span>
        </a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <!-- 面包屑 -->
      <nav class="breadcrumb" aria-label="面包屑">
        <a href="index.html">首页</a>
        <span aria-hidden="true">/</span>
        <a href="products.html">全部商品</a>
        <span aria-hidden="true">/</span>
        <span>商品详情</span>
      </nav>

      <!-- 详情内容由 js/product.js 渲染 -->
      <section id="product-detail" style="margin-top: 16px;"></section>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div>
          <h3>🍿 零食铺子</h3>
          <p>暖橙奶油风零食小店，只做让人开心的那一口。全场零食产地直采，新鲜看得见。</p>
        </div>
        <div>
          <h3>逛一逛</h3>
          <ul class="footer-links">
            <li><a href="index.html">首页</a></li>
            <li><a href="products.html">全部商品</a></li>
            <li><a href="cart.html">购物车</a></li>
          </ul>
        </div>
        <div>
          <h3>联系我们</h3>
          <ul class="footer-links">
            <li><a href="mailto:hello@example.com">hello@example.com</a></li>
            <li>客服时间 09:00–21:00</li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">© 2024 零食铺子 · 静态演示站点，仅供学习使用</div>
    </div>
  </footer>

  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- 脚本：data → cart → main → product（详情页） -->
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
